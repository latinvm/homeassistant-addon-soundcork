name: SoundCork
version: 0.2.2
slug: soundcork
description: Self-hosted replacement for the Bose SoundTouch cloud, with optional HTTP Basic auth on /admin and /mgmt
url: https://github.com/latinvm/homeassistant-addon-soundcork
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
host_network: true
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: SoundCork HTTP API
map:
  - share:rw
options:
  base_url: ""
  ADMIN_BASIC_AUTH_USER: ""
  ADMIN_BASIC_AUTH_PASSWORD: ""
  data_dir: /data/soundcork
schema:
  base_url: str
  ADMIN_BASIC_AUTH_USER: str?
  ADMIN_BASIC_AUTH_PASSWORD: password?
  data_dir: str
