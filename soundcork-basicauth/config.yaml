name: SoundCork (Basic Auth)
version: 0.0.1
slug: soundcork_basicauth
description: SoundCork with optional HTTP Basic auth on /admin and /mgmt (tracks a PR branch on the latinvm/soundcork fork)
url: https://github.com/latinvm/homeassistant-addon-soundcork
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
ports:
  8000/tcp: 8001
ports_description:
  8000/tcp: SoundCork HTTP API (host port 8001 to coexist with the production SoundCork add-on on 8000)
map:
  - share:rw
options:
  base_url: ""
  ADMIN_BASIC_AUTH_USER: ""
  ADMIN_BASIC_AUTH_PASSWORD: ""
  data_dir: /data/soundcork
schema:
  base_url: str
  ADMIN_BASIC_AUTH_USER: str?
  ADMIN_BASIC_AUTH_PASSWORD: password?
  data_dir: str
